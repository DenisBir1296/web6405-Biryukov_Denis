<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
	<header>
        <nav>
			<h3>Планеты</h3>
            <div>
                <a href="index.html">Главная</a>
                <a href="jupiter.html">Юпитер</a>
                <a href="saturn.html">Сатурн</a>
			</div>
			<a href="sign_in.html" class="sign_in active">Войти</a>
        </nav>
    </header>
    <main class="signin-main">
		<div class="login-container">
			<h1>Вход в систему</h1>
			<form id="loginForm">
				
				<div class="form-group">
					<label for="username">Логин или Email</label>
					<input type="text" id="username" placeholder="Введите ваш логин или email" required>
				</div>

				<div class="form-group">
					<label for="password">Пароль</label>
					<input type="password" id="password" placeholder="Введите ваш пароль" required>
				</div>

				<div class="checkbox-group">
					<input type="checkbox" id="remember">
					<label for="remember">Запомнить меня</label>
				</div>

				<button type="submit" class="btn-login">Войти</button>
			</form>
		</div>
    </main>
</body>
</html>
